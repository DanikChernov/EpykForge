services:
  forge-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FORGE_ENV: local
      FORGE_DEMO_MODE: "true"
      FORGE_STORE_BACKEND: local
      FORGE_STATE_PATH: /app/data/forge_state.json
      FORGE_MODEL_PROVIDER: TEST_STUB
    ports:
      - "8080:8080"
    volumes:
      - forge-data:/app/data

  forge-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:8080"
    depends_on:
      - forge-api

volumes:
  forge-data:
